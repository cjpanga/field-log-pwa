<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Field Log</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181c" id="themeColorMeta">

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Log">
<link rel="apple-touch-icon" href="icons/icon-180-v2.png">
<link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="icons/icon-180-dark-v2.png">
<link rel="icon" href="icons/icon-192-v2.png">

<style>
  :root {
    --bg: #14181c;
    --panel: #1c2127;
    --panel-raised: #232a31;
    --line: #333c44;
    --text: #e8ebee;
    --text-dim: #8b95a1;
    --accent: #ff6b1a;
    --accent-dim: #7a3a13;
    --accent-light: #ffb347;
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 16px;
    padding-top: max(28px, calc(env(safe-area-inset-top) + 12px));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .total-bar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 14px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .total-value { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--accent); }

  .punch-btn {
    width: 100%;
    padding: 26px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, color 0.1s ease, outline-color 0.1s ease;
    outline: 2px solid transparent;
    outline-offset: -6px;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .punch-btn.pressed {
    transform: scale(0.97);
    background: transparent;
    color: var(--text);
    outline-color: var(--accent);
  }

  .note-row {
    display: flex;
    margin-top: 14px;
  }

  .note-row input {
    flex: 1;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: var(--sans);
  }
  .note-row input:focus { outline: none; border-color: var(--accent); }

  .log {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .entry {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .entry-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .entry-time { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
  .entry-note {
    font-size: 14.5px;
    color: var(--text);
    background: transparent;
    border: none;
    padding: 0;
    width: 100%;
  }
  .entry-note:focus { outline: none; }
  .entry-note::placeholder { color: var(--text-dim); font-style: italic; }

  .entry-gap {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
    text-align: right;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .del-btn:active { color: var(--accent); }

  .empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 10px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    margin-top: 14px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .actions button.primary {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .actions button:active { background: var(--panel-raised); }

  .actions button.confirm-pending {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .actions button.confirm-pending-final {
    background: var(--accent-light);
    border-color: var(--accent-light);
    color: var(--bg);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel-raised);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .warn-note {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

  .export-box {
    display: none;
    margin-top: 12px;
  }
  .export-box.active { display: block; }
  .export-box textarea {
    width: 100%;
    min-height: 160px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
  }

  .settings-fab {
    position: fixed;
    right: 18px;
    bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .settings-fab:active { background: var(--line); color: var(--text); }
  .settings-fab svg { width: 24px; height: 24px; }

  .undo-fab {
    position: fixed;
    left: 18px;
    bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .undo-fab:active { background: var(--line); color: var(--text); }
  .undo-fab svg { width: 28px; height: 28px; }
  .undo-fab:disabled { opacity: 0.35; cursor: default; }
  .undo-fab:disabled:active { background: var(--panel-raised); color: var(--text-dim); }

  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  .settings-overlay.active { opacity: 1; pointer-events: auto; }

  .settings-panel {
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 20px;
    padding-bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
    transform: translateY(12px);
    transition: transform 0.2s ease;
  }
  .settings-overlay.active .settings-panel { transform: translateY(0); }

  .settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .settings-header h2 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .settings-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  .settings-close:active { color: var(--text); }

  .settings-section h3 {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .theme-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .theme-option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
  }
  .theme-option.active { border-color: var(--accent); }

  .theme-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .theme-option-label {
    flex: 1;
    font-size: 14.5px;
    color: var(--text);
    font-weight: 600;
  }

  .theme-check {
    color: var(--accent);
    font-size: 18px;
    visibility: hidden;
  }
  .theme-option.active .theme-check { visibility: visible; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Field Log</h1>
    <div class="date" id="dateDisplay"></div>
  </header>

  <div class="total-bar">
    <span class="total-label">Time since punch</span>
    <span class="total-value" id="totalElapsed">00:00:00</span>
  </div>

  <button class="punch-btn" id="punchBtn">Log Punch</button>

  <div class="note-row" id="noteRow">
    <input type="text" id="noteInput" placeholder="What's happening?" autocomplete="off">
  </div>

  <div id="logContainer">
    <div class="empty" id="emptyState">No entries yet. Tap "Log Punch" when you leave the office, arrive on site, wrap up — whatever you want timestamped.</div>
    <div class="log" id="log"></div>
  </div>

  <div class="actions">
    <button id="copyBtn" class="primary">Copy Log</button>
    <button id="resetTimerBtn">Reset Timer</button>
    <button id="resetBtn">Reset Day</button>
  </div>

  <div class="export-box" id="exportBox">
    <textarea id="exportText" readonly></textarea>
  </div>

  <div class="warn-note" id="warnNote">Saved on this device automatically. Works fully offline.</div>
</div>

<div class="toast" id="toast"></div>

<button class="undo-fab" id="undoBtn" aria-label="Undo" disabled>
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M9.04 5.66A7 7 0 1 1 5.24 10.19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M2.4 6.9 8.4 4l.4 6.6Z" fill="currentColor"/>
  </svg>
</button>

<button class="settings-fab" id="settingsBtn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
    <path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.02-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.38.96a7.5 7.5 0 0 0-1.73-1l-.36-2.53a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.53c-.63.24-1.2.58-1.73 1l-2.38-.96a.5.5 0 0 0-.6.22L2.7 9.28a.5.5 0 0 0 .12.64L4.84 11.5c-.04.33-.06.66-.06 1s.02.67.06 1L2.82 15.08a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.6.22l2.38-.96c.53.42 1.1.76 1.73 1l.36 2.53a.5.5 0 0 0 .5.43h3.84a.5.5 0 0 0 .5-.43l.36-2.53c.63-.24 1.2-.58 1.73-1l2.38.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
</button>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" id="settingsCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="settings-section">
      <h3>Theme</h3>
      <div class="theme-list" id="themeList"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'fieldLog.entries.v1';
  const THEME_STORAGE_KEY = 'fieldLog.theme.v1';
  const UNDO_STORAGE_KEY = 'fieldLog.undo.v1';
  const MAX_UNDO_STEPS = 50;

  const THEMES = [
    {
      id: 'orange',
      label: 'Dark Orange',
      swatch: '#ff6b1a',
      vars: {
        '--bg': '#14181c',
        '--panel': '#1c2127',
        '--panel-raised': '#232a31',
        '--line': '#333c44',
        '--text': '#e8ebee',
        '--text-dim': '#8b95a1',
        '--accent': '#ff6b1a',
        '--accent-dim': '#7a3a13',
        '--accent-light': '#ffb347'
      }
    },
    {
      id: 'navy-gold',
      label: 'Pros4Tech',
      swatch: '#d4a83c',
      vars: {
        '--bg': '#0d1526',
        '--panel': '#141d33',
        '--panel-raised': '#1c2740',
        '--line': '#2c3a5c',
        '--text': '#e8ebee',
        '--text-dim': '#8b93ab',
        '--accent': '#d4a83c',
        '--accent-dim': '#6b551e',
        '--accent-light': '#f0c860'
      }
    },
    {
      id: 'first-order',
      label: 'First Order',
      swatch: '#b3182a',
      vars: {
        '--bg': '#0a0a0a',
        '--panel': '#1a1a1a',
        '--panel-raised': '#242424',
        '--line': '#3d3d3d',
        '--text': '#f2f2f2',
        '--text-dim': '#9a9a9a',
        '--accent': '#b3182a',
        '--accent-dim': '#4d0a12',
        '--accent-light': '#d9505e'
      }
    },
    {
      id: 'hulk-green',
      label: 'Hulk Green',
      swatch: '#1ed760',
      vars: {
        '--bg': '#070a08',
        '--panel': '#0d130e',
        '--panel-raised': '#141d15',
        '--line': '#263626',
        '--text': '#eaf2ec',
        '--text-dim': '#8aa08f',
        '--accent': '#1ed760',
        '--accent-dim': '#0f5c30',
        '--accent-light': '#6ee89a'
      }
    }
  ];

  const NOTE_PROMPTS = [
    "What's happening?",
    "What's up?",
    "What's going on?",
    "Where you at?",
    "What now?",
    "What's next?"
  ];

  let entries = [];
  let totalTimer = null;
  let timerResetAt = null;
  let undoStack = [];

  const punchBtn = document.getElementById('punchBtn');
  const noteInput = document.getElementById('noteInput');
  const logEl = document.getElementById('log');
  const emptyState = document.getElementById('emptyState');
  const totalElapsedEl = document.getElementById('totalElapsed');
  const copyBtn = document.getElementById('copyBtn');
  const exportBox = document.getElementById('exportBox');
  const exportText = document.getElementById('exportText');
  const resetTimerBtn = document.getElementById('resetTimerBtn');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('toast');
  const dateDisplay = document.getElementById('dateDisplay');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsCloseBtn = document.getElementById('settingsCloseBtn');
  const themeList = document.getElementById('themeList');
  const themeColorMeta = document.getElementById('themeColorMeta');
  const undoBtn = document.getElementById('undoBtn');

  dateDisplay.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

  // --- theme ---

  function applyTheme(themeId) {
    const theme = THEMES.find((t) => t.id === themeId) || THEMES[0];
    Object.entries(theme.vars).forEach(([prop, value]) => {
      document.documentElement.style.setProperty(prop, value);
    });
    themeColorMeta.setAttribute('content', theme.vars['--bg']);
    try {
      localStorage.setItem(THEME_STORAGE_KEY, theme.id);
    } catch (err) {
      // theme just won't persist across reloads this session
    }
    renderThemeList(theme.id);
  }

  function renderThemeList(activeId) {
    themeList.innerHTML = '';
    THEMES.forEach((theme) => {
      const btn = document.createElement('button');
      btn.className = 'theme-option' + (theme.id === activeId ? ' active' : '');
      btn.innerHTML = `
        <span class="theme-swatch" style="background:${theme.swatch}"></span>
        <span class="theme-option-label">${theme.label}</span>
        <span class="theme-check">&check;</span>
      `;
      btn.addEventListener('click', () => applyTheme(theme.id));
      themeList.appendChild(btn);
    });
  }

  function loadSavedTheme() {
    try {
      return localStorage.getItem(THEME_STORAGE_KEY) || THEMES[0].id;
    } catch (err) {
      return THEMES[0].id;
    }
  }

  function openSettings() {
    settingsOverlay.classList.add('active');
  }

  function closeSettings() {
    settingsOverlay.classList.remove('active');
  }

  settingsBtn.addEventListener('click', openSettings);
  settingsCloseBtn.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  function fmtTime(d) {
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  }

  function fmtDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
  }

  function fmtGap(ms) {
    const totalMin = Math.round(ms / 60000);
    if (totalMin < 1) return '<1m';
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `+${h}h ${m}m` : `+${m}m`;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // --- persistence ---

  function saveEntries() {
    try {
      const serializable = entries.map(e => ({ time: e.time.toISOString(), note: e.note }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable));
    } catch (err) {
      showToast('Save failed — storage may be full');
    }
  }

  function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return parsed
        .map(e => ({ time: new Date(e.time), note: e.note || '' }))
        .filter(e => !isNaN(e.time.getTime()));
    } catch (err) {
      return [];
    }
  }

  // --- undo ---
  // Snapshots the state before a "normal" action (punch, delete, Reset
  // Timer, Reset Day) so it can be reverted. Note edits are intentionally
  // excluded. Capped at MAX_UNDO_STEPS so the history can't grow forever.

  function saveUndoStack() {
    try {
      localStorage.setItem(UNDO_STORAGE_KEY, JSON.stringify(undoStack));
    } catch (err) {
      // undo history just won't persist across reloads this session
    }
  }

  function loadUndoStack() {
    try {
      const raw = localStorage.getItem(UNDO_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function updateUndoBtn() {
    undoBtn.disabled = undoStack.length === 0;
  }

  function pushUndoSnapshot() {
    undoStack.push({
      entries: entries.map((e) => ({ time: e.time.toISOString(), note: e.note })),
      timerResetAt: timerResetAt ? timerResetAt.toISOString() : null
    });
    if (undoStack.length > MAX_UNDO_STEPS) undoStack.shift();
    saveUndoStack();
    updateUndoBtn();
  }

  undoBtn.addEventListener('click', () => {
    if (undoStack.length === 0) return;
    const snapshot = undoStack.pop();
    saveUndoStack();
    entries = snapshot.entries.map((e) => ({ time: new Date(e.time), note: e.note }));
    timerResetAt = snapshot.timerResetAt ? new Date(snapshot.timerResetAt) : null;
    saveEntries();
    resetTimerConfirm();
    resetDayConfirm();
    render();
    updateTotal();
    updateUndoBtn();
  });

  // --- rendering ---

  function updateTotal() {
    if (entries.length === 0) {
      totalElapsedEl.textContent = '00:00:00';
      return;
    }
    const punchStart = entries[entries.length - 1].time;
    const start = timerResetAt && timerResetAt > punchStart ? timerResetAt : punchStart;
    const now = new Date();
    totalElapsedEl.textContent = fmtDuration(now - start);
  }

  function render() {
    if (entries.length === 0) {
      emptyState.style.display = 'block';
      logEl.innerHTML = '';
      updateTotal();
      return;
    }
    emptyState.style.display = 'none';
    logEl.innerHTML = '';

    entries.forEach((entry, idx) => {
      const div = document.createElement('div');
      div.className = 'entry';

      const gap = idx > 0 ? fmtGap(entry.time - entries[idx - 1].time) : '';

      div.innerHTML = `
        <div class="entry-left">
          <span class="entry-time">${fmtTime(entry.time)}</span>
          <input class="entry-note" type="text" placeholder="add note" value="${entry.note.replace(/"/g, '&quot;')}" data-idx="${idx}">
        </div>
        <span class="entry-gap">${gap}</span>
        <button class="del-btn" data-idx="${idx}">&times;</button>
      `;
      logEl.appendChild(div);
    });

    // wire up note edits
    logEl.querySelectorAll('.entry-note').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        entries[idx].note = e.target.value;
        saveEntries();
      });
    });

    // wire up deletes
    logEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        pushUndoSnapshot();
        entries.splice(idx, 1);
        saveEntries();
        render();
      });
    });

    updateTotal();
  }

  function logPunch() {
    pushUndoSnapshot();
    const timestamp = new Date();
    entries.push({ time: timestamp, note: noteInput.value.trim() });
    saveEntries();
    timerResetAt = null;
    resetTimerConfirm();
    render();
    noteInput.value = '';
    noteInput.placeholder = NOTE_PROMPTS[Math.floor(Math.random() * NOTE_PROMPTS.length)];
    noteInput.focus();
    if (navigator.vibrate) navigator.vibrate(30);
  }

  punchBtn.addEventListener('click', logPunch);

  // Drive the pressed visual directly from touch/mouse events instead of
  // CSS :active — iOS Safari delays :active on touch by design (to
  // disambiguate a tap from the start of a long-press/selection gesture),
  // which made the button feel unresponsive and let the long-press trigger
  // the native text-selection callout instead.
  const press = () => punchBtn.classList.add('pressed');
  const unpress = () => punchBtn.classList.remove('pressed');

  punchBtn.addEventListener('touchstart', press, { passive: true });
  punchBtn.addEventListener('touchend', unpress);
  punchBtn.addEventListener('touchcancel', unpress);
  punchBtn.addEventListener('mousedown', press);
  punchBtn.addEventListener('mouseup', unpress);
  punchBtn.addEventListener('mouseleave', unpress);

  noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') logPunch();
  });

  function buildLogText() {
    let text = `Field Log — ${dateDisplay.textContent}\n`;
    if (entries.length > 0) {
      const dayTotal = new Date() - entries[0].time;
      text += `Total elapsed: ${fmtDuration(dayTotal)}\n\n`;
    }
    entries.forEach((entry, idx) => {
      const gap = idx > 0 ? '  (' + fmtGap(entry.time - entries[idx - 1].time) + ')' : '';
      text += `${fmtTime(entry.time)}${gap} — ${entry.note || '(no note)'}\n`;
    });
    return text;
  }

  // Resolves true if the clipboard write succeeded, false if the
  // manual-select fallback had to be shown instead (fallbackShowExport
  // already surfaces its own toast in that case).
  function copyLogText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => {
        fallbackShowExport(text);
        return false;
      });
    }
    fallbackShowExport(text);
    return Promise.resolve(false);
  }

  copyBtn.addEventListener('click', () => {
    if (entries.length === 0) {
      showToast('Nothing to copy yet');
      return;
    }
    copyLogText(buildLogText()).then((copied) => {
      if (copied) showToast('Copied to clipboard');
    });
  });

  function fallbackShowExport(text) {
    exportText.value = text;
    exportBox.classList.add('active');
    exportText.focus();
    exportText.select();
    showToast('Copy failed — text selected below');
  }

  // Generic multi-tap confirm: each entry in `stages` is shown in order as
  // the button is tapped; the final tap (past the last stage) runs `onConfirm`.
  // Auto-reverts to the original label after 3s of inactivity at any stage.
  function makeConfirmButton(btn, stages, guard, guardFailMessage, onConfirm) {
    const originalLabel = btn.textContent;
    const allClasses = stages.map((s) => s.class);
    let stage = 0;
    let timer = null;

    function reset() {
      clearTimeout(timer);
      stage = 0;
      btn.classList.remove(...allClasses);
      btn.textContent = originalLabel;
    }

    btn.addEventListener('click', () => {
      if (!guard()) {
        showToast(guardFailMessage);
        return;
      }

      clearTimeout(timer);

      if (stage < stages.length) {
        const { text, class: cls } = stages[stage];
        btn.classList.remove(...allClasses);
        btn.classList.add(cls);
        btn.textContent = text;
        stage++;
        timer = setTimeout(reset, 3000);
        return;
      }

      reset();
      onConfirm();
    });

    return reset;
  }

  const resetTimerConfirm = makeConfirmButton(
    resetTimerBtn,
    [{ text: 'RESET?', class: 'confirm-pending' }],
    () => entries.length > 0,
    'Nothing to reset',
    () => {
      pushUndoSnapshot();
      timerResetAt = new Date();
      updateTotal();
      showToast('Timer reset');
    }
  );

  const resetDayConfirm = makeConfirmButton(
    resetBtn,
    [
      { text: 'RESET', class: 'confirm-pending' },
      { text: 'ARE YOU SURE?', class: 'confirm-pending-final' }
    ],
    () => entries.length > 0,
    'Nothing to clear',
    () => {
      pushUndoSnapshot();
      // Copy the day's log out before it's gone, as insurance against
      // losing a whole day's data to a reset.
      copyLogText(buildLogText()).then((copied) => {
        if (copied) showToast('Copied, then cleared');
      });
      entries = [];
      timerResetAt = null;
      resetTimerConfirm();
      saveEntries();
      exportBox.classList.remove('active');
      render();
    }
  );

  // --- init ---
  applyTheme(loadSavedTheme());
  entries = loadEntries();
  undoStack = loadUndoStack();
  updateUndoBtn();
  noteInput.placeholder = NOTE_PROMPTS[Math.floor(Math.random() * NOTE_PROMPTS.length)];
  render();
  totalTimer = setInterval(updateTotal, 1000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // offline support just won't be available this session
      });
    });
  }
</script>
</body>
</html>
